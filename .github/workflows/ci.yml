name: CI Check

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check index.html exists
        run: test -f index.html && echo "index.html OK" || exit 1

      - name: Check style.css exists
        run: test -f style.css && echo "style.css OK" || exit 1

      - name: Check app.js exists
        run: test -f app.js && echo "app.js OK" || exit 1

      - name: Check no broken script tags
        run: |
          if grep -q "src=\"app.js\"" index.html; then
            echo "Script tag OK"
          else
            echo "ERROR: app.js not linked in index.html"
            exit 1
          fi

      - name: Check no broken stylesheet links
        run: |
          if grep -q "href=\"style.css\"" index.html; then
            echo "Stylesheet link OK"
          else
            echo "ERROR: style.css not linked in index.html"
            exit 1
          fi
